name: Deploy Supabase backend

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      SUPABASE_ACCESS_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: supabase-backend
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify database permissions and business rules
        run: npm test
      - name: Verify Supabase handlers without contacting providers
        run: npm run test:backend
      - name: Deploy database and Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: lsofzsartjesgwetcpzw
        run: npm run deploy:backend
