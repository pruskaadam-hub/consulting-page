name: Deploy landing page to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  backend:
    uses: ./.github/workflows/backend.yml
    secrets:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  build:
    needs: backend
    runs-on: ubuntu-24.04
    env:
      VITE_CAL_USERNAME: adam-pruska
      VITE_CAL_INTRO_SLUG: nezavazna-konzultace
      VITE_CAL_INDIVIDUAL_SLUG: soukroma-konzultace
      VITE_CAL_PACKAGE_SLUG: soukroma-konzultace
      VITE_SUPABASE_URL: https://lsofzsartjesgwetcpzw.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_ENABLE_EVENTS: 'true'
      VITE_GA4_MEASUREMENT_ID: ${{ vars.VITE_GA4_MEASUREMENT_ID || 'G-L6HVJMS1XE' }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify reservation API contracts
        run: npm test
      - name: Build and type check
        run: npm run build
      - name: Verify protected Supabase handlers without contacting providers
        run: npm run test:backend
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Validate pages and reservation flow without creating real bookings
        run: npm run test:ui
      - name: Verify admin access and consent with isolated fixtures
        run: npm run test:admin
      - name: Verify public Cal.com availability and browser access
        run: node scripts/verify-cal-config.mjs
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload website
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
